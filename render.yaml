services:
  - type: web
    name: image-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python image_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
